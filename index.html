<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ligne SQL">
<title>Ligne SQL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Révision SQL / MySQL en 8 jours : cours, flashcards, quiz et exercices, utilisable hors ligne.">
<meta name="theme-color" content="#1A2747">
<style>
/* Layout : un plan de métro. Chaque module est une ligne colorée (vraies couleurs de la table sublines),
   chaque jour de révision une station sur une ligne verticale ; en-tête en plaque émaillée. */
:root {
  --bg: #F2F3EF;
  --surface: #FFFFFF;
  --surface-2: #E8EAE3;
  --ink: #15213B;
  --muted: #586174;
  --rule: #D3D7CD;
  --plaque: #1A2747;
  --plaque-ink: #F4F5F1;
  --accent: #0064B0;
  --accent-ink: #FFFFFF;
  --ok: #00774A;
  --ok-bg: #DFF1E8;
  --bad: #B3083F;
  --bad-bg: #F9E2E9;
  --warn: #8A5F00;
  --warn-bg: #FAEFD0;
  --code-bg: #18233F;
  --code-ink: #E6EAF3;
  --t-kw: #82C8FF;
  --t-str: #F5C27A;
  --t-num: #BDE58A;
  --t-com: #8E98B0;
  --t-fn: #F6A9C0;
  --font-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  --r: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1423; --surface: #161E32; --surface-2: #1F2942; --ink: #E7EAF1; --muted: #9AA3B8; --rule: #2B3653;
    --plaque: #22335C; --plaque-ink: #F4F5F1; --accent: #5DB0F6; --accent-ink: #0B1220;
    --ok: #4CCB93; --ok-bg: #11352A; --bad: #FF7398; --bad-bg: #3B1726; --warn: #F2C55A; --warn-bg: #3A2F12;
    --code-bg: #0A1020; --code-ink: #E6EAF3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1423; --surface: #161E32; --surface-2: #1F2942; --ink: #E7EAF1; --muted: #9AA3B8; --rule: #2B3653;
  --plaque: #22335C; --plaque-ink: #F4F5F1; --accent: #5DB0F6; --accent-ink: #0B1220;
  --ok: #4CCB93; --ok-bg: #11352A; --bad: #FF7398; --bad-bg: #3B1726; --warn: #F2C55A; --warn-bg: #3A2F12;
  --code-bg: #0A1020; --code-ink: #E6EAF3;
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--font-body);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
}
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--plaque); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
code, pre, kbd { font-family: var(--font-mono); }
:not(pre) > code { font-size: .88em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- En-tête plaque ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--plaque); color: var(--plaque-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--plaque-ink); display: grid; place-items: center; font: 800 15px/1 var(--font-display); flex: none; }
.brand-name { font: 800 19px/1.1 var(--font-display); font-stretch: 80%; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name small { display: block; font: 500 12px/1.2 var(--font-body); letter-spacing: .02em; text-transform: none; opacity: .8; }
.top-stats { display: flex; gap: 6px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font: 700 13px/1.4 var(--font-display); background: rgba(255,255,255,.12); white-space: nowrap; font-variant-numeric: tabular-nums; }
.theme-btn { background: transparent; border: 1px solid rgba(255,255,255,.3); color: var(--plaque-ink); border-radius: 999px; width: 32px; height: 32px; display: grid; place-items: center; flex: none; }

/* ---------- Navigation bas ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs ul { list-style: none; margin: 0 auto; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 760px; }
.tabs button { width: 100%; height: var(--nav-h); background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 12px/1 var(--font-body); color: var(--muted); }
.tabs svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"] svg { stroke-width: 2.4; }

main { padding-block: 18px 28px; }
.view { display: grid; gap: 18px; }
.view-head { display: grid; gap: 4px; }
.view-head h1 { font-size: 28px; font-weight: 800; font-stretch: 85%; }
.eyebrow { font: 700 12px/1.3 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); font-weight: 700; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- Badges de ligne ---------- */
.lb { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--c); color: var(--ci); font: 800 15px/1 var(--font-display); }
.lb.lg { width: 52px; height: 52px; font-size: 22px; }

/* ---------- Tableau de bord ---------- */
.hero { background: var(--plaque); color: var(--plaque-ink); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.countdown { font: 800 64px/0.9 var(--font-display); font-stretch: 75%; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.countdown small { display: block; font: 600 14px/1.3 var(--font-body); letter-spacing: 0; opacity: .85; margin-top: 6px; }
.hero label { font-size: 13px; display: grid; gap: 4px; }
.hero input[type="date"] { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: var(--plaque-ink); color-scheme: dark; }
.today { background: rgba(255,255,255,.08); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.today .row .btn { background: var(--plaque-ink); color: var(--plaque); border-color: transparent; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } .countdown { font-size: 52px; } }

/* ---------- Ligne de métro (planning) ---------- */
.metro { list-style: none; margin: 0; padding: 0; position: relative; }
.metro::before { content: ""; position: absolute; left: 15px; top: 18px; bottom: 18px; width: 6px; border-radius: 3px; background: var(--plaque); opacity: .9; }
.stop { position: relative; padding: 0 0 18px 48px; }
.stop-dot { position: absolute; left: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 5px solid var(--plaque); }
.stop.done .stop-dot { background: var(--ok); border-color: var(--ok); }
.stop.current .stop-dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 35%, transparent); }
.stop-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.stop.current .stop-card { border-color: var(--accent); border-width: 2px; }
.stop-title { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.stop-title h3 { font-size: 19px; font-weight: 800; }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: start; padding-top: 8px; border-top: 1px dashed var(--rule); }
.slot input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ok); }
.slot-label { font-weight: 700; }
.slot-label small { font-weight: 400; color: var(--muted); }
.slot .row { grid-column: 2; }
.terminus .stop-dot { border-radius: 6px; background: var(--bad); border-color: var(--bad); }

/* ---------- Cours ---------- */
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.line-row { width: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; }
.line-row:hover { border-color: var(--accent); }
.line-row .t { display: block; font: 700 17px/1.25 var(--font-display); }
.line-row .s { display: block; font-size: 13.5px; color: var(--muted); }
.line-meta { display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.read-chip { font: 700 11px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }

.mod-head { border-radius: var(--r); padding: 16px; display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-top: 8px solid var(--c); }
.mod-head h1 { font-size: 26px; font-weight: 800; font-stretch: 85%; }
.prose { display: grid; gap: 12px; min-width: 0; }
.prose h3 { font-size: 20px; font-weight: 800; margin-top: 10px; }
.prose h4 { font-size: 16px; font-weight: 700; margin-top: 6px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { background: var(--surface-2); font-family: var(--font-display); font-weight: 700; }
.tbl caption { caption-side: top; text-align: left; padding: 6px 10px; font: 700 12px/1 var(--font-mono); color: var(--muted); }
table.res { font-family: var(--font-mono); font-size: 13px; width: auto; min-width: 100%; }
table.res tr.hl td { background: var(--warn-bg); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo > * { min-width: 0; }
@media (max-width: 480px) { .duo { grid-template-columns: 1fr; } }
.order2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.order2 > div { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font-family: var(--font-mono); font-size: 14px; }
.order2 > div > strong { font-family: var(--font-display); }
.order2 ol { padding-left: 22px; margin: 6px 0 0; }
.tip, .trap, .oos { border-radius: 8px; padding: 12px 14px; font-size: 15px; display: grid; gap: 4px; }
.tip { background: var(--ok-bg); }
.trap { background: var(--bad-bg); }
.oos { background: var(--warn-bg); }
.tip::before, .trap::before, .oos::before { font: 800 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.tip::before { content: "À retenir"; color: var(--ok); }
.trap::before { content: "Piège"; color: var(--bad); }
.oos::before { content: "Périmètre du contrôle"; color: var(--warn); }
.ok-chip { display: inline-block; font: 800 11px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; background: var(--ok-bg); color: var(--ok); padding: 4px 7px; border-radius: 4px; margin-right: 4px; }
ul.crit li::marker { content: "✗  "; color: var(--bad); }
.mcd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 700 14px/1 var(--font-mono); overflow-x: auto; }
.mcd .ent { border: 2px solid var(--ink); padding: 8px 10px; background: var(--surface); }
.mcd .asso { border: 2px solid var(--ink); border-radius: 999px; padding: 8px 12px; background: var(--surface-2); }
.mcd .card { color: var(--bad); }
.statement { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; margin-top: 8px; }

pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; tab-size: 2; }
pre.code code { background: none; padding: 0; font-size: inherit; white-space: pre; }
pre.code u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.t-kw { color: var(--t-kw); font-weight: 600; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-fn { color: var(--t-fn); }

.recap { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.recap textarea { width: 100%; min-height: 110px; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); resize: vertical; }
details > summary { cursor: pointer; font-weight: 700; }
.model { margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }

/* ---------- Flashcards ---------- */
.deck-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); max-width: 100%; }
.flip { perspective: 1200px; }
.flip-inner { position: relative; min-height: 260px; transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; cursor: pointer; }
.flip.is-flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; padding: 22px; display: grid; align-content: center; gap: 12px; border: 1px solid var(--rule); background: var(--surface); overflow: auto; }
.face.back { transform: rotateY(180deg); background: var(--surface-2); }
.face .lb { position: absolute; top: 14px; left: 14px; width: 28px; height: 28px; font-size: 13px; }
.face-front-text { font: 800 26px/1.2 var(--font-display); font-stretch: 85%; text-align: center; text-wrap: balance; }
.face-back-text { font-size: 18px; line-height: 1.5; text-align: center; overflow-wrap: anywhere; }
.face .hint { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
.deck-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deck-actions .btn { min-height: 54px; font-size: 16px; border-radius: 12px; }
.btn.no { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.btn.yes { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.box { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.box b { display: block; font: 800 18px/1.1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Jeux ---------- */
.games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.game { text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; }
.game:hover { border-color: var(--accent); }
.game .t { display: block; font: 800 18px/1.2 var(--font-display); }
.game .s { display: block; font-size: 13.5px; color: var(--muted); }
.game .tag { display: block; font: 700 11px/1.3 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.game.wide { grid-column: 1 / -1; background: var(--plaque); color: var(--plaque-ink); border-color: var(--plaque); }
.game.wide .s, .game.wide .tag { color: var(--plaque-ink); opacity: .85; }
@media (max-width: 420px) { .games { grid-template-columns: 1fr; } }
.filter { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 4px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.chip .lb { width: 24px; height: 24px; font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 700; }
.chip.all { padding: 4px 12px; }

/* ---------- Scène de jeu (plein écran) ---------- */
.stage { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.stage-bar { background: var(--plaque); color: var(--plaque-ink); }
.stage-bar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.stage-bar h2 { font-size: 17px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-bar button { background: transparent; color: var(--plaque-ink); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 5px 12px; font-weight: 700; }
.stage-meta { font: 700 14px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.progress { height: 5px; background: var(--surface-2); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.stage-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.stage-body { padding-block: 18px 32px; display: grid; gap: 14px; }
.q { font: 700 20px/1.35 var(--font-display); text-wrap: pretty; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--rule); background: var(--surface); font-size: 16px; display: flex; gap: 10px; align-items: center; overflow-wrap: anywhere; }
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font: 800 13px/1 var(--font-display); }
.choice.mono { font-family: var(--font-mono); font-size: 14px; white-space: pre-line; }
.choice.is-right { border-color: var(--ok); background: var(--ok-bg); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice[disabled] { cursor: default; }
.feedback { border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.feedback.ok { background: var(--ok-bg); }
.feedback.ko { background: var(--bad-bg); }
.feedback strong { font-family: var(--font-display); font-size: 17px; }
.feedback.ok strong { color: var(--ok); }
.feedback.ko strong { color: var(--bad); }
.minitables { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.minitables > * { min-width: 0; }
.minitables .tbl table { font-size: 12.5px; }
.minitables td, .minitables th { padding: 4px 7px; }
@media (max-width: 420px) { .minitables { grid-template-columns: 1fr; } }
.null { color: var(--muted); font-style: italic; }
.score-big { font: 800 72px/1 var(--font-display); font-stretch: 75%; font-variant-numeric: tabular-nums; }
.recap-list { display: grid; gap: 10px; }

  html: `
<p>Une <strong>base de données</strong> stocke des données de façon organisée. Un <strong>SGBD</strong> (Système de Gestion de Base de Données) est le logiciel qui la gère : MySQL, PostgreSQL… Quand les données sont rangées en <strong>tables</strong> reliées par des <strong>clés</strong>, on parle de SGBD<strong>R</strong> (relationnel). On l'interroge en <strong>SQL</strong> (Structured Query Language).</p>
<ul>
  <li><strong>Table</strong> = un type d'objet (members, books…).</li>
  <li><strong>Ligne</strong> (enregistrement, tuple) = un objet précis (le membre Léa Martin).</li>
  <li><strong>Colonne</strong> (champ, attribut) = une propriété typée (last_name VARCHAR(100)).</li>
</ul>

<h3>Relationnel ou non relationnel</h3>
<div class="tbl"><table>
<thead><tr><th></th><th>Relationnel (SQL)</th><th>Non relationnel (NoSQL)</th></tr></thead>
<tbody>
<tr><td>Structure</td><td>Tables, schéma fixe défini à l'avance</td><td>Documents JSON, clé-valeur, colonnes, graphes. Schéma souple</td></tr>
<tr><td>Relations</td><td>Clés étrangères + jointures</td><td>Données souvent dupliquées / imbriquées</td></tr>
<tr><td>Garanties</td><td>ACID</td><td>BASE</td></tr>
<tr><td>Montée en charge</td><td>Plutôt verticale (plus gros serveur)</td><td>Horizontale (plus de serveurs)</td></tr>
<tr><td>Exemples</td><td>MySQL, MariaDB, PostgreSQL, SQL Server, Oracle</td><td>MongoDB (document), Redis (clé-valeur), Cassandra (colonnes), Neo4j (graphe)</td></tr>
</tbody></table></div>

<h3>ACID</h3>
<p>Garanties d'une <strong>transaction</strong> (un groupe d'opérations qui doit réussir ou échouer en bloc, ex. un virement : débit + crédit).</p>
<ul>
  <li><strong>A</strong>tomicité : tout ou rien. Si ça coupe entre deux instructions, l'état antérieur est rétabli.</li>
  <li><strong>C</strong>ohérence : la transaction fait passer la base d'un état valide à un autre état valide (contraintes respectées).</li>
  <li><strong>I</strong>solation : plusieurs transactions simultanées donnent le même résultat que si elles avaient été exécutées l'une après l'autre.</li>
  <li><strong>D</strong>urabilité : une fois validée, une modification survit à une panne ou à un redémarrage.</li>
</ul>
<p>Plus lent et plus contraignant : on l'utilise dans les systèmes lourds (banque, gros SaaS).</p>
<div class="trap"><strong>Attention à ta note sur la durabilité.</strong> Elle dit « chaque changement à la structure doit être documenté ». La définition standard est : <em>ce qui est validé reste écrit, même après un crash</em>. Au contrôle, donne la définition standard. Tu peux citer la formulation de ta prof en complément.</div>

<h3>BASE</h3>
<ul>
  <li><strong>B</strong>asically <strong>A</strong>vailable : le système répond toujours, même si la réponse est incomplète.</li>
  <li><strong>S</strong>oft state : l'état des données peut changer sans nouvelle requête (ex. réplication entre serveurs).</li>
  <li><strong>E</strong>ventually consistent : tout finit par s'équilibrer, les copies convergent.</li>
</ul>
<p>Plus adapté à la plupart des usages à grande échelle : vise la <strong>disponibilité</strong> et la <strong>scalabilité</strong>.</p>
<div class="oos">Les transactions (START TRANSACTION, COMMIT, ROLLBACK) sont <strong>hors programme</strong> d'après ta prof. Retiens ACID/BASE comme <em>théorie</em>, sans la syntaxe des transactions.</div>

<h3>Les SGBDR à connaître</h3>
<div class="tbl"><table>
<thead><tr><th>SGBDR</th><th>Points forts</th><th>Usage typique</th></tr></thead>
<tbody>
<tr><td>MySQL</td><td>La base, très répandu, simple</td><td>Web, CMS (WordPress), applis web</td></tr>
<tr><td>MariaDB</td><td>Fork de MySQL, plus rapide sur certaines opérations, plus de moteurs</td><td>Applis web, scalable</td></tr>
<tr><td>PostgreSQL</td><td>Très complet, JSON avancé, extensions (PostGIS)</td><td>Big data, géospatial, microservices</td></tr>
<tr><td>SQL Server</td><td>Très bon avec .NET, licence propriétaire</td><td>Entreprises, écosystème Microsoft</td></tr>
<tr><td>Oracle</td><td>Le plus de fonctionnalités et de support, coûte cher</td><td>Grandes entreprises, banques, gros SaaS</td></tr>
</tbody></table></div>

<h3>Moteurs de stockage (MySQL / MariaDB)</h3>
<p>Le <strong>moteur</strong> gère : le format de stockage des tables et index, le verrouillage et les transactions, le support des clés étrangères, la vitesse lecture/écriture, la tolérance aux pannes.</p>
<div class="tbl"><table>
<thead><tr><th></th><th>InnoDB</th><th>MyISAM</th></tr></thead>
<tbody>
<tr><td>Statut</td><td>Défaut actuel</td><td>Ancien</td></tr>
<tr><td>Transactions / ACID</td><td>Oui</td><td>Non</td></tr>
<tr><td>Clés étrangères</td><td>Appliquées</td><td>Ignorées</td></tr>
<tr><td>Verrouillage</td><td>Par ligne</td><td>Par table entière</td></tr>
<tr><td>Point fort</td><td>Robuste, fiable</td><td>Rapide en lecture simple</td></tr>
</tbody></table></div>
<div class="tip"><strong>Exemple dans ton TP.</strong> Le dump <code>subways.sql</code> utilise <code>ENGINE=MyISAM</code>, donc aucune clé étrangère n'y est vérifiée. Ton <code>app_musique</code> est en InnoDB : là, les FK sont appliquées. En pratique, préfère InnoDB dès que possible.</div>

<h3>Les familles de commandes SQL</h3>
<ul>
  <li><strong>DDL</strong> (Data Definition, la structure) : CREATE, ALTER, DROP, TRUNCATE.</li>
  <li><strong>DML</strong> (Data Manipulation, les données) : SELECT, INSERT, UPDATE, DELETE.</li>
  <li><strong>DCL</strong> (Data Control, les droits) : GRANT, REVOKE.</li>
  <li><span class="muted">TCL (transactions) : COMMIT, ROLLBACK. Hors programme.</span></li>
</ul>
<p class="muted">La doc MySQL range ça en « Definition Statements », « Manipulation Statements », « Administration / Utility Statements » et « Functions », comme dans le Notion de ta prof.</p>
`,

<h3>Clé primaire (PRIMARY KEY)</h3>
<p>Colonne (ou groupe de colonnes) qui <strong>identifie chaque ligne de façon unique</strong>. Toujours <code>NOT NULL</code>, <strong>une seule par table</strong>.</p>
<pre class="code"><code data-lang="sql">CREATE TABLE author (
  id INT AUTO_INCREMENT PRIMARY KEY,   -- clé technique
  last_name VARCHAR(100) NOT NULL
);</code></pre>
<ul>
  <li><strong>Clé technique</strong> (surrogate) : un <code>id</code> auto-incrémenté sans sens métier. Stable, compact. C'est le choix par défaut.</li>
  <li><strong>Clé naturelle</strong> : une donnée métier unique (ISBN, n° de sécu). Risque : elle peut changer ou être mal saisie.</li>
  <li><strong>Clé composite</strong> : plusieurs colonnes ensemble, typique des tables d'association.</li>
</ul>
<pre class="code"><code data-lang="sql">CREATE TABLE follows (
  user_id INT NOT NULL,
  artist_id INT NOT NULL,
  PRIMARY KEY (user_id, artist_id)     -- un user ne suit pas 2 fois le même artiste
);</code></pre>

<h3>Clé étrangère (FOREIGN KEY)</h3>
<p>Colonne qui <strong>référence la clé primaire d'une autre table</strong>. Elle garantit l'<strong>intégrité référentielle</strong> : pas de ligne « orpheline » qui pointe vers un parent inexistant.</p>
<pre class="code"><code data-lang="sql">CREATE TABLE book (
  id INT AUTO_INCREMENT PRIMARY KEY,
  title VARCHAR(255) NOT NULL,
  author_id INT NOT NULL,
  CONSTRAINT fk_book_author
    FOREIGN KEY (author_id) REFERENCES author(id)
    ON DELETE RESTRICT
    ON UPDATE CASCADE
);</code></pre>
<div class="tbl"><table>
<thead><tr><th>Action</th><th>Quand on supprime le parent…</th></tr></thead>
<tbody>
<tr><td><code>RESTRICT</code> / <code>NO ACTION</code> (défaut)</td><td>Refusé tant qu'un enfant le référence (erreur 1451)</td></tr>
<tr><td><code>CASCADE</code></td><td>Les enfants sont supprimés aussi</td></tr>
<tr><td><code>SET NULL</code></td><td>La FK des enfants passe à NULL (colonne nullable obligatoire)</td></tr>
</tbody></table></div>
<div class="trap"><strong>Deux erreurs à reconnaître :</strong><br>
<code>1452 Cannot add or update a child row</code> : tu insères un enfant dont la FK pointe vers un parent qui n'existe pas.<br>
<code>1451 Cannot delete or update a parent row</code> : tu supprimes un parent encore référencé (RESTRICT).</div>

<h3>Autres contraintes</h3>
<ul>
  <li><code>NOT NULL</code> : valeur obligatoire.</li>
  <li><code>UNIQUE</code> : pas de doublon (accepte plusieurs NULL). On peut en avoir plusieurs par table, ex. <code>email</code>, <code>pseudo</code>.</li>

  <li><code>CHECK (condition)</code> : règle métier, appliquée depuis MySQL 8.0.16. Ex. <code>CHECK (annual_rate &gt;= 0)</code>.</li>
  <li><code>AUTO_INCREMENT</code> : numérotation automatique.</li>
</ul>

<h3>Index</h3>
<p>Un <strong>index</strong> accélère les recherches sur une colonne, comme l'index d'un livre. MySQL en crée automatiquement pour PK, UNIQUE et FK (InnoDB). En contrepartie, les écritures sont un peu plus lentes et ça prend de la place.</p>
<pre class="code"><code data-lang="sql">CREATE INDEX idx_book_title ON book(title);</code></pre>

<p>Démarche en 3 étapes : <strong>MCD</strong> (conceptuel, on réfléchit métier) → <strong>MLD</strong> (logique, des tables) → <strong>MPD</strong> (physique, le script SQL pour un SGBD précis).</p>

<h3>MCD : le vocabulaire</h3>
<ul>
  <li><strong>Entité</strong> (rectangle) : un objet du métier. MEMBER, BOOK…</li>
  <li><strong>Attribut</strong> : une propriété (title, loan_date).</li>
  <li><strong>Identifiant</strong> (souligné) : attribut unique, deviendra la PK.</li>
  <li><strong>Association</strong> (ovale, un verbe) : lien entre entités. MAKE, WRITE…</li>
  <li><strong>Cardinalités (min,max)</strong> : sur chaque patte, combien de fois <em>une</em> occurrence de l'entité participe à l'association. min ∈ {0,1}, max ∈ {1,n}.</li>
</ul>

<h3>Lire une cardinalité</h3>
<p>On lit <strong>depuis l'entité</strong>, la cardinalité collée à elle :</p>
<div class="mcd" role="img" aria-label="MEMBER 0,n MAKE 1,1 LOAN">
  <span class="ent">MEMBER</span><span class="card">0,n</span><span class="asso">MAKE</span><span class="card">1,1</span><span class="ent">LOAN</span>
</div>
<ul>
  <li>Un membre <strong>fait 0 à n</strong> emprunts (il peut n'en faire aucun).</li>
  <li>Un emprunt <strong>est fait par 1 et 1 seul</strong> membre.</li>
</ul>

<h3>Règles de passage MCD → MLD</h3>
<ol>
  <li><strong>Chaque entité devient une table</strong>, son identifiant devient la clé primaire (soulignée).</li>
  <li><strong>Association 1-n</strong> (un côté <code>x,1</code>, l'autre <code>x,n</code>) : la clé primaire du côté <code>n</code> devient une <strong>clé étrangère dans la table du côté <code>1</code></strong>. L'association disparaît. Si c'est <code>0,1</code>, la FK peut être NULL.</li>
  <li><strong>Association n-n</strong> (<code>x,n</code> des deux côtés) : elle devient une <strong>table associative</strong>. Sa PK est <strong>composite</strong> (les deux FK), et elle reçoit les attributs de l'association s'il y en a (association « porteuse »).</li>
  <li><strong>Association 1-1</strong> : FK d'un côté + UNIQUE, ou fusion des deux tables.</li>
</ol>
<div class="tip"><strong>Réflexe :</strong> la FK va du côté où le max vaut 1. « Un emprunt concerne 1 livre » → <code>book_id</code> va dans LOAN.</div>

<h3>Notation MLD</h3>
<pre class="code"><code data-lang="txt">SUBSCRIPTION (<u>id_subscription</u>, label, annual_rate, max_concurrent_loans)
MEMBER (<u>id_member</u>, last_name, first_name, registration_date, #id_subscription)
LOAN (<u>id_loan</u>, loan_date, due_date, return_date, #id_member, #id_book)</code></pre>

  html: `
<h3>Fonctions d'agrégat</h3>
<p>Elles résument <strong>plusieurs lignes en une valeur</strong> : <code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code> (et <code>GROUP_CONCAT</code> en MySQL).</p>
<div class="tbl"><table>
<tbody>
<tr><td><code>COUNT(*)</code></td><td>Nombre de <strong>lignes</strong></td></tr>
<tr><td><code>COUNT(col)</code></td><td>Nombre de valeurs <strong>non NULL</strong></td></tr>
<tr><td><code>COUNT(DISTINCT col)</code></td><td>Nombre de valeurs <strong>différentes</strong> non NULL</td></tr>
<tr><td><code>AVG(col)</code></td><td>Moyenne, <strong>NULL ignorés</strong> (ni comptés ni additionnés)</td></tr>
<tr><td><code>SUM</code> sur 0 ligne</td><td>NULL (alors que COUNT donne 0). Utilise <code>IFNULL(SUM(x), 0)</code></td></tr>
</tbody></table></div>

<h3>GROUP BY : un résultat par groupe</h3>
<pre class="code"><code data-lang="sql">SELECT type, COUNT(*) AS nb
FROM book
GROUP BY type
ORDER BY nb DESC;</code></pre>
<div class="tip"><strong>Règle d'or :</strong> chaque colonne du SELECT est soit <strong>dans le GROUP BY</strong>, soit <strong>dans une fonction d'agrégat</strong>. Sinon MySQL renvoie l'erreur 1055 (mode ONLY_FULL_GROUP_BY). Grouper par l'id <em>et</em> le nom (<code>GROUP BY s.id, s.number</code>) est une bonne habitude : deux lignes peuvent avoir le même nom.</div>

<h3>WHERE ou HAVING</h3>
<pre class="code"><code data-lang="sql">SELECT s.name, COUNT(*) AS nb_lignes
FROM stations s
JOIN stations_in_lines sil ON sil.station_id = s.id
WHERE s.name LIKE 'P%'          -- filtre des LIGNES, avant regroupement
GROUP BY s.id, s.name
HAVING COUNT(*) &gt;= 2;           -- filtre des GROUPES, après regroupement</code></pre>
<p><strong>WHERE</strong> ne peut pas contenir d'agrégat (il s'exécute avant le regroupement). <strong>HAVING</strong>, oui.</p>

<h3>Moyenne d'un comptage : table dérivée</h3>
<p>On ne peut pas écrire <code>AVG(COUNT(*))</code>. On compte dans une sous-requête, puis on fait la moyenne :</p>
<pre class="code"><code data-lang="sql">SELECT AVG(nb) AS moyenne

  SELECT COUNT(sil.id) AS nb
  FROM sublines sl
  LEFT JOIN stations_in_lines sil ON sil.line_id = sl.id
  GROUP BY sl.id
) AS t;                        -- alias obligatoire          → 19.55</code></pre>

<p>Les données sont réparties dans plusieurs tables (pour éviter les doublons). Une <strong>jointure</strong> les recolle grâce aux clés.</p>

<h3>Les types</h3>
<div class="tbl"><table>

<h3>IN / NOT IN (une liste)</h3>
<pre class="code"><code data-lang="sql">SELECT title FROM book WHERE id NOT IN (SELECT book_id FROM loan);   -- jamais empruntés</code></pre>
<div class="trap"><strong>NOT IN et NULL :</strong> si la sous-requête renvoie <strong>un seul NULL</strong>, <code>NOT IN</code> ne renvoie <strong>rien</strong> (x &lt;&gt; NULL est « inconnu »). Utilise <code>NOT EXISTS</code> ou ajoute <code>WHERE col IS NOT NULL</code> dans la sous-requête.</div>

<h3>EXISTS / NOT EXISTS (sous-requête corrélée)</h3>
<pre class="code"><code data-lang="sql">SELECT m.first_name, m.last_name
FROM member m
WHERE NOT EXISTS (
  SELECT 1 FROM loan l WHERE l.member_id = m.id   -- fait référence à m : corrélée
);                                                -- Jade, Sami</code></pre>
<p>Une sous-requête <strong>corrélée</strong> utilise une colonne de la requête externe. Elle est réévaluée pour chaque ligne.</p>

<h3>Table dérivée (dans le FROM)</h3>
<pre class="code"><code data-lang="sql">SELECT MAX(nb) FROM (SELECT COUNT(*) AS nb FROM loan GROUP BY book_id) AS t;</code></pre>
<div class="trap">Alias obligatoire, sinon : <code>Error 1248 Every derived table must have its own alias</code>.</div>

FROM book b JOIN loan l ON l.book_id = b.id
GROUP BY b.id, b.title
HAVING COUNT(*) = (SELECT MAX(nb) FROM (SELECT COUNT(*) AS nb FROM loan GROUP BY book_id) AS t);</code></pre>

<h3>UNION et UNION ALL</h3>
<pre class="code"><code data-lang="sql">(SELECT 'ligne la plus courte' AS type, sl.number AS 'nom de la ligne'
 FROM sublines sl JOIN stations_in_lines sil ON sil.line_id = sl.id
 GROUP BY sl.id, sl.number ORDER BY COUNT(*) ASC LIMIT 1)
UNION ALL
(SELECT 'ligne la plus longue', sl.number
 FROM sublines sl JOIN stations_in_lines sil ON sil.line_id = sl.id
 GROUP BY sl.id, sl.number ORDER BY COUNT(*) DESC LIMIT 1);</code></pre>

function highlightSql(src) {
  const re = /(--[^\n]*)|('(?:[^'\\]|\\.|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="t-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="t-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="t-num">' + m[3] + '</span>';
    else {

      const up = word.toUpperCase();
      if (SQL_FN.has(up) && src[re.lastIndex] === '(') out += '<span class="t-fn">' + word + '</span>';
      else if (SQL_KW.has(up)) out += '<span class="t-kw">' + word + '</span>';
      else out += esc(word);
    }
    last = re.lastIndex;
  }

}

function memoHTML() {
  return `
  <div class="row"><button type="button" class="btn small ghost" data-go="view:cours">← Toutes les lignes</button></div>
  <div class="view-head"><p class="eyebrow">Une page, la veille et le matin</p><h1 id="h-cours">Mémo express</h1></div>
  <article class="prose">
    <h3>Squelette d'un SELECT</h3>
<pre class="code"><code data-lang="sql">SELECT t.col, AGG(x.col) AS alias          -- 5
FROM table_a t                              -- 1
[LEFT] JOIN table_b x ON x.a_id = t.id      -- 1
WHERE condition_sur_les_lignes              -- 2
GROUP BY t.id, t.col                        -- 3
HAVING condition_sur_les_groupes            -- 4
ORDER BY alias DESC                         -- 6
LIMIT 10 OFFSET 0;                          -- 7</code></pre>
    <h3>Créer et modifier</h3>
<pre class="code"><code data-lang="sql">CREATE TABLE enfant (
  id INT AUTO_INCREMENT PRIMARY KEY,
  nom VARCHAR(100) NOT NULL UNIQUE,
  prix DECIMAL(8,2) NOT NULL DEFAULT 0,
  parent_id INT NOT NULL,
  FOREIGN KEY (parent_id) REFERENCES parent(id) ON DELETE CASCADE
) ENGINE=InnoDB;

INSERT INTO t (a, b) VALUES (1, 'x'), (2, 'y');
UPDATE t SET b = 'z' WHERE id = 2;
DELETE FROM t WHERE id = 2;
ALTER TABLE t ADD COLUMN c DATE NULL;</code></pre>
    <h3>Les 13 pièges</h3>
    <ol>
      <li><code>= NULL</code> ne marche jamais : <code>IS NULL</code>.</li>
      <li>Après un LEFT JOIN : <code>COUNT(droite.id)</code>, pas <code>COUNT(*)</code>.</li>
      <li>Un filtre sur la table de droite d'un LEFT JOIN va dans le <code>ON</code>.</li>
      <li>Un agrégat dans WHERE ne marche pas : <code>HAVING</code>.</li>
      <li>Colonne du SELECT ni groupée ni agrégée : erreur 1055.</li>
      <li>Un alias du SELECT n'est pas utilisable dans WHERE (mais l'est dans ORDER BY).</li>
      <li>AND passe avant OR : mets des parenthèses.</li>
      <li><code>NOT IN</code> + un NULL = 0 ligne : <code>NOT EXISTS</code>.</li>
      <li>Table dérivée sans alias : erreur 1248.</li>
      <li><code>LIMIT 1</code> ignore les ex æquo : <code>HAVING COUNT(*) = (SELECT MAX…)</code>.</li>
      <li>UPDATE / DELETE sans WHERE : toute la table.</li>
      <li>Tables parents créées avant les enfants.</li>
      <li>Deux tables enfants jointes en même temps : double comptage.</li>
    </ol>
    <h3>Merise en 3 règles</h3>
    <ul>
      <li>Entité → table, identifiant → PK soulignée.</li>
      <li>1-n → FK du côté où le max vaut 1.</li>
      <li>n-n → table associative, PK composite des deux FK, + attributs de l'association.</li>
    </ul>
    <h3>CLI</h3>
<pre class="code"><code data-lang="sql">mysql -u root -p                                -- terminal
SOURCE C:/chemin/fichier.sql;                   -- dans mysql&gt;
mysqldump -u root -p base &gt; sauvegarde.sql      -- terminal
SHOW DATABASES;  USE base;  SHOW TABLES;  DESCRIBE t;  SHOW CREATE TABLE t;
CREATE USER 'app'@'localhost' IDENTIFIED BY '...';
GRANT SELECT, INSERT ON base.* TO 'app'@'localhost';</code></pre>
    <h3>Théorie en 5 lignes</h3>
    <ul>
      <li><strong>ACID</strong> : Atomicité (tout ou rien), Cohérence (contraintes respectées), Isolation (comme en série), Durabilité (survit aux pannes).</li>
      <li><strong>BASE</strong> : Basically Available, Soft state, Eventually consistent → disponibilité et scalabilité.</li>
      <li><strong>InnoDB</strong> : défaut, transactions, FK, verrouillage par ligne. <strong>MyISAM</strong> : ancien, pas de FK ni de transactions, rapide en lecture.</li>
      <li><strong>SGBDR</strong> : MySQL (web), MariaDB (fork), PostgreSQL (géo, JSON, big data), SQL Server (.NET), Oracle (grands comptes).</li>
      <li><strong>DDL</strong> structure · <strong>DML</strong> données · <strong>DCL</strong> droits. Hors programme : INTERSECT, EXCEPT, transactions.</li>
    </ul>
  </article>`;
}

let deck = null;

function buildDeck(filter) {
  let list;
  if (filter === 'due') {
    // ratées / peu sues, + jamais vues des lignes déjà lues
    list = CARDS.filter((c) => (c.id in state.box ? state.box[c.id] < 2 : !!state.read[c.m]));
  } else if (filter === 'all') {
    list = CARDS.slice();
  } else if (filter.startsWith('ids=')) {
    const ids = filter.slice(4).split('|');
    list = CARDS.filter((c) => ids.includes(c.id));
  } else {
    const mods = filter.split(',');
    list = CARDS.filter((c) => mods.includes(c.m));
  }
  list = shuffle(list).sort((a, b) => (state.box[a.id] || 0) - (state.box[b.id] || 0));
  deck = { filter, cards: list, i: 0, flipped: false, again: [], known: 0 };
}

function renderCartes(opts = {}) {
  if (opts.filter) buildDeck(opts.filter);
  else if (!deck) buildDeck('due');
  const el = $('#view-cartes');
  const dueCount = CARDS.filter((c) => (c.id in state.box ? state.box[c.id] < 2 : !!state.read[c.m])).length;
  const counts = [0, 0, 0, 0, 0];
  CARDS.forEach((c) => { if (c.id in state.box) counts[state.box[c.id]]++; });
  const options = [
    ['due', `À revoir (${dueCount})`],
    ['all', `Toutes (${CARDS.length})`],
    ...MODULES.map((m) => [m.id, `Ligne ${m.n} · ${m.title} (${CARDS.filter((c) => c.m === m.id).length})`]),
  ];
  const selected = options.some(([v]) => v === deck.filter) ? deck.filter : '';
  const head = `
    <div class="view-head"><p class="eyebrow">Répétition espacée</p><h1 id="h-cartes">Flashcards</h1></div>
    <div class="deck-bar">
      <label for="deck-filter" class="muted">Paquet</label>
      <select id="deck-filter">${selected ? '' : '<option value="" selected>Sélection en cours</option>'}${options.map(([v, l]) => `<option value="${v}"${v === selected ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
    </div>`;
  const legend = `
    <div class="boxes" aria-label="Répartition des cartes par boîte">
      ${['Ratées', 'Boîte 1', 'Boîte 2', 'Boîte 3', 'Maîtrisées'].map((l, k) => `<div class="box"><b>${counts[k]}</b>${l}</div>`).join('')}
    </div>
    <p class="muted" style="font-size:14px">« Je savais » fait monter la carte d'une boîte, « À revoir » la renvoie à zéro. Le paquet « À revoir » contient les cartes ratées et celles des lignes que tu as lues.</p>`;

  if (!deck.cards.length) {
    el.innerHTML = head + `<div class="recap"><p><strong>Rien à revoir pour l'instant.</strong> Lis une ligne du cours ou choisis un paquet dans la liste.</p><div class="row"><button type="button" class="btn primary" data-go="cards:all">Toutes les cartes</button></div></div>` + legend;
    return;
  }
  if (deck.i >= deck.cards.length) {
    const againIds = deck.again.map((c) => c.id).join('|');
    el.innerHTML = head + `<div class="recap pop"><p class="eyebrow">Paquet terminé</p><p class="score-big">${deck.known}/${deck.cards.length}</p><p>${deck.again.length ? deck.again.length + ' carte(s) à revoir.' : 'Tout est su. Passe aux jeux pour vérifier.'}</p>
      <div class="row">${deck.again.length ? `<button type="button" class="btn primary" data-go="cards:ids=${againIds}">Revoir les ${deck.again.length} ratée(s)</button>` : ''}<button type="button" class="btn" data-go="cards:${esc(deck.filter)}">Recommencer ce paquet</button></div></div>` + legend;
    if (!deck.again.length) burst();
    return;
  }
  const c = deck.cards[deck.i];
  const m = MOD[c.m];
  el.innerHTML = head + `
    <p class="muted" style="font-variant-numeric:tabular-nums">Carte ${deck.i + 1} / ${deck.cards.length} · boîte ${state.box[c.id] || 0}</p>
    <div class="flip${deck.flipped ? ' is-flipped' : ''}" id="flip">
      <div class="flip-inner" role="button" tabindex="0" aria-label="${deck.flipped ? 'Réponse affichée. Touche pour revoir la question' : 'Touche pour voir la réponse'}">
        <div class="face front" aria-hidden="${deck.flipped}">${lineBadge(m)}<p class="face-front-text">${esc(c.f)}</p><span class="hint">Touche la carte pour voir la réponse</span></div>
        <div class="face back" aria-hidden="${!deck.flipped}">${lineBadge(m)}<p class="face-back-text">${esc(c.b)}</p></div>
      </div>
    </div>
    <div class="deck-actions">
      <button type="button" class="btn no" data-card="again"${deck.flipped ? '' : ' disabled'}>À revoir</button>
      <button type="button" class="btn yes" data-card="known"${deck.flipped ? '' : ' disabled'}>Je savais</button>
    </div>` + legend;
}

function flipCard() {
  if (!deck || deck.i >= deck.cards.length) return;
  deck.flipped = !deck.flipped;
  const flip = $('#flip');
  if (!flip) return;
  flip.classList.toggle('is-flipped', deck.flipped);
  $('.face.front', flip).setAttribute('aria-hidden', String(deck.flipped));
  $('.face.back', flip).setAttribute('aria-hidden', String(!deck.flipped));
  $$('[data-card]').forEach((b) => { b.disabled = !deck.flipped; });
}
function gradeCard(kind) {
  const c = deck.cards[deck.i];
  if (!c || !deck.flipped) return;
  if (kind === 'known') { state.box[c.id] = Math.min(4, (state.box[c.id] || 0) + 1); state.xp += 2; deck.known++; }
  else { state.box[c.id] = 0; deck.again.push(c); }
  markActive();
  save();
  deck.i++;
  deck.flipped = false;
  renderCartes({});
  const inner = $('#flip .flip-inner');
  if (inner) { inner.classList.add('pop'); inner.focus({ preventScroll: true }); }
}

let stageCleanup = null;
let lastFocus = null;
const stageBody = () => $('#stage-body');
const setProgress = (r) => { $('#stage-prog').style.width = Math.round(Math.min(1, Math.max(0, r)) * 100) + '%'; };
const setMeta = (t) => { $('#stage-meta').textContent = t; };

function openStage(title) {
  if (stageCleanup) { stageCleanup(); stageCleanup = null; }
  if ($('#stage').hidden) lastFocus = document.activeElement;
  $('#stage').hidden = false;
  document.body.classList.add('locked');
  $('#stage-title').textContent = title;
  setMeta('');
  setProgress(0);
  $('#stage-scroll').scrollTop = 0;
  $('#stage-title').focus({ preventScroll: true });
}
function closeStage() {
  if (stageCleanup) { stageCleanup(); stageCleanup = null; }
  $('#stage').hidden = true;
  document.body.classList.remove('locked');
  rerender();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function stageMessage(title, html) {
  openStage(title);
  stageBody().innerHTML = `<div class="recap">${html}</div><div class="row"><button type="button" class="btn primary" data-close>Fermer</button></div>`;
}

function miniTablesHTML() {
  const cell = (v) => (v === null ? '<span class="null">NULL</span>' : esc(v));
  const table = (name) => {
    const t = MINI_TABLES[name];
    return `<div class="tbl"><table class="res"><caption>${name}</caption><thead><tr>${t.cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((v) => `<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  };
  return `<div class="minitables">${table('eleves')}${table('clubs')}</div>`;
}

function choicesFor(it) {
  const letters = (list) => list.map((c, k) => Object.assign(c, { key: String.fromCharCode(65 + k) }));
  switch (it.kind) {
    case 'mc': return letters(shuffle(it.c.map((t, k) => ({ html: esc(t), ok: k === 0 }))));
    case 'predict': return letters(shuffle(it.c.map((t, k) => ({ html: esc(t), ok: k === 0, mono: true }))));
    case 'tf': return [{ html: 'Vrai', ok: it.v === true, key: 'V' }, { html: 'Faux', ok: it.v === false, key: 'F' }];
    case 'bug': return it.lines.map((t, k) => ({ html: esc(t), ok: k === it.a, mono: true, key: String(k + 1) }));
    default: return [];
  }
}
function promptHTML(it) {
  const eyebrow = `<p class="eyebrow">Ligne ${MOD[it.m].n} · ${KIND_LABEL[it.kind]}</p>`;
  switch (it.kind) {
    case 'mc': return eyebrow + `<p class="q">${esc(it.q)}</p>` + (it.code ? codeBlock(it.code) : '');
    case 'tf': return eyebrow + `<p class="q">${esc(it.s)}</p>`;
    case 'predict': return eyebrow + miniTablesHTML() + codeBlock(it.code) + '<p class="q">Que renvoie cette requête ?</p>';
    case 'bug': return eyebrow + '<p class="q">Quelle ligne pose problème ?</p>';
    default: return '';
  }
}
const promptText = (it) => esc(it.q || it.s || (it.kind === 'predict' ? 'Que renvoie cette requête ?' : 'Quelle ligne pose problème ?'));
function recapItemHTML(r) {
  const it = r.it;
  const right = r.ch.find((c) => c.ok);
  const yours = r.k >= 0 ? r.ch[r.k] : null;
  const code = it.kind === 'predict' ? codeBlock(it.code) : it.kind === 'bug' ? codeBlock(it.lines.join('\n')) : '';
  return `<div class="recap-item"><p class="eyebrow">Ligne ${MOD[it.m].n} · ${KIND_LABEL[it.kind]}</p><p><strong>${promptText(it)}</strong></p>${code}
    <p>Ta réponse : ${yours ? `<span style="color:var(--bad)">${yours.html.replace(/\n/g, ' / ')}</span>` : '<em>pas de réponse</em>'}</p>
    <p>Bonne réponse : <span style="color:var(--ok);font-weight:700">${right.html.replace(/\n/g, ' / ')}</span></p>
    <p class="muted">${esc(it.why)}</p></div>`;
}
const praise = (s) => (s >= 3 ? `Exact ! Série de ${s}.` : 'Exact !');
function verdict(pct) {
  if (pct >= 90) return 'Excellent : ces notions sont solides.';
  if (pct >= 70) return 'Bien. Relis les explications ci-dessous, puis refais tes erreurs.';
  if (pct >= 50) return 'Moyen. Relis le cours de ces lignes avant de rejouer.';
  return 'Pas encore acquis. Reprends le cours de ces lignes, puis rejoue.';
}

// -------- Quiz générique (apprentissage ou examen) --------
function runQuiz(title, items, opts = {}) {
  const exam = !!opts.exam;
  const minutes = opts.minutes || 0;
  if (!items.length) return stageMessage(title, '<p>Aucune question pour cette sélection.</p>');
  openStage(title);
  const body = stageBody();
  let i = 0;
  let run = 0;
  let finished = false;
  let remaining = minutes * 60;
  let timerId = null;
  const results = [];

  if (exam) {
    setMeta(fmtTime(remaining));
    timerId = setInterval(() => {
      remaining--;
      setMeta(fmtTime(remaining));
      if (remaining <= 0) finish();
    }, 1000);
  }
  stageCleanup = () => clearInterval(timerId);

  function render() {
    const it = items[i];
    it._ch = choicesFor(it);
    setProgress(i / items.length);
    if (!exam) setMeta((i + 1) + ' / ' + items.length);
    body.innerHTML = promptHTML(it) +
      `<div class="choices">${it._ch.map((c, k) => `<button type="button" class="choice${c.mono ? ' mono' : ''}" data-k="${k}"><span class="k" aria-hidden="true">${c.key}</span><span>${c.html}</span></button>`).join('')}</div>
       <div id="fb" aria-live="polite"></div>` +
      (exam ? `<p class="muted" style="font-size:13px">Question ${i + 1} / ${items.length}. Correction à la fin.</p>` : '');
    $$('.choice', body).forEach((b) => b.addEventListener('click', () => answer(Number(b.dataset.k))));
    $('#stage-scroll').scrollTop = 0;
  }

  function answer(k) {
    const it = items[i];
    const ok = it._ch[k].ok;
    results.push({ it, k, ok, ch: it._ch });
    if (exam) { i++; if (i >= items.length) finish(); else render(); return; }
    record(it, ok);
    run = ok ? run + 1 : 0;
    $$('.choice', body).forEach((b, idx) => {
      b.disabled = true;
      if (it._ch[idx].ok) b.classList.add('is-right');
      else if (idx === k) b.classList.add('is-wrong');
    });
    const fb = $('#fb', body);
    fb.innerHTML = `<div class="feedback ${ok ? 'ok' : 'ko'} pop"><strong>${ok ? praise(run) : 'Pas tout à fait.'}</strong><p>${esc(it.why)}</p></div>
      <div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="next-q">${i + 1 < items.length ? 'Question suivante' : 'Voir mon score'}</button></div>`;
    if (ok && run > 0 && run % 5 === 0) burst();
    const next = $('#next-q', body);
    next.addEventListener('click', () => { i++; if (i >= items.length) finish(); else render(); });
    next.focus({ preventScroll: true });
    fb.scrollIntoView({ block: 'nearest', behavior: reducedMotion ? 'auto' : 'smooth' });
  }

  function finish() {
    if (finished) return;
    finished = true;
    clearInterval(timerId);
    setProgress(1);
    if (exam) {
      // Questions non traitées à la fin du chrono = fausses
      items.slice(results.length).forEach((it) => results.push({ it, k: -1, ok: false, ch: it._ch || choicesFor(it) }));
      results.forEach((r) => record(r.it, r.ok));
    }
    const score = results.filter((r) => r.ok).length;
    const pct = Math.round((100 * score) / items.length);
    if (exam && (state.best.exam === null || pct > state.best.exam)) { state.best.exam = pct; save(); }
    if (pct >= 80) burst();
    const mistakes = results.filter((r) => !r.ok);
    setMeta(pct + ' %');
    body.innerHTML = `<p class="eyebrow">${exam ? 'Examen blanc terminé' : 'Session terminée'}</p>
      <div class="score-big">${score}/${items.length}</div><p>${verdict(pct)}</p>
      <div class="row"><button type="button" class="btn primary" id="again">Rejouer</button>${mistakes.length ? '<button type="button" class="btn" id="retry">Refaire mes erreurs</button>' : ''}<button type="button" class="btn" data-close>Fermer</button></div>
      ${mistakes.length ? `<h3 style="font-size:19px">À retravailler (${mistakes.length})</h3><div class="recap-list">${mistakes.map(recapItemHTML).join('')}</div>` : ''}`;
    $('#again', body).addEventListener('click', () => runQuiz(title, shuffle(items), opts));
    const retry = $('#retry', body);
    if (retry) retry.addEventListener('click', () => runQuiz('Mes erreurs', shuffle(mistakes.map((r) => r.it))));
    $('#stage-scroll').scrollTop = 0;
  }

  render();
}

function startQuiz(mods) {
  const pool = filterMods([...QCM, ...TF], mods);
  const label = mods.length ? 'Quiz · ' + mods.map((m) => 'L' + MOD[m].n).join(', ') : 'Quiz express';
  runQuiz(label, pick(pool, 10));
}
function startPredict(mods) { runQuiz('Prédis le résultat', pick(filterMods(PREDICT, mods), 8)); }
function startBugs(mods) { runQuiz('Trouve l\'erreur', pick(filterMods(BUGS, mods), 6)); }
function startExam() {
  const items = shuffle([...pick(QCM, 8), ...pick(PREDICT, 4), ...pick(BUGS, 3), ...pick(TF, 5)]);
  runQuiz('Examen blanc', items, { exam: true, minutes: 25 });
}
function startWrong() {
  const items = wrongItems();
  if (!items.length) return stageMessage('Mes erreurs', '<p><strong>Aucune erreur enregistrée.</strong> Joue à un quiz : chaque mauvaise réponse viendra ici.</p>');
  runQuiz('Mes erreurs', shuffle(items).slice(0, 15));
}

// -------- Sprint Vrai / Faux --------
function startSprint(mods) {
  let pool = filterMods(TF, mods);
  if (pool.length < 8) pool = TF;
  openStage('Sprint Vrai / Faux');
  const body = stageBody();
  body.innerHTML = `<div class="recap"><p class="q">60 secondes, un maximum de bonnes réponses.</p><p class="muted">Au clavier : touche V pour vrai, F pour faux.</p><div class="row"><button type="button" class="btn primary" id="sp-go">Partir</button></div></div>`;
  $('#sp-go', body).addEventListener('click', go);
  $('#sp-go', body).focus({ preventScroll: true });

  function go() {
    let queue = shuffle(pool);
    let cur = queue.pop();
    let score = 0;
    let done = 0;
    let left = 60;
    let locked = false;
    const misses = [];
    body.innerHTML = `<div class="timer" id="sp-timer" aria-live="off">60</div>
      <div class="sprint-card" id="sp-card"></div>
      <div class="sprint-btns"><button type="button" class="btn yes" data-v="1">Vrai</button><button type="button" class="btn no" data-v="0">Faux</button></div>
      <p class="muted" id="sp-score" aria-live="polite" style="text-align:center">Score : 0</p>`;
    const card = $('#sp-card', body);
    const showCur = () => { card.textContent = cur.s; };
    showCur();
    const tick = setInterval(() => {
      left--;
      $('#sp-timer', body).textContent = left;
      setProgress(1 - left / 60);
      if (left <= 0) end();
    }, 1000);
    const onKey = (e) => {
      if (e.key === 'v' || e.key === 'V') answer(true);
      else if (e.key === 'f' || e.key === 'F') answer(false);
    };
    document.addEventListener('keydown', onKey);
    stageCleanup = () => { clearInterval(tick); document.removeEventListener('keydown', onKey); };
    $$('[data-v]', body).forEach((b) => b.addEventListener('click', () => answer(b.dataset.v === '1')));

    function answer(v) {
      if (locked || left <= 0) return;
      locked = true;
      const ok = v === cur.v;
      done++;
      record(cur, ok);
      if (ok) score++; else misses.push(cur);
      $('#sp-score', body).textContent = 'Score : ' + score;
      card.classList.add(ok ? 'flash-ok' : 'flash-ko');
      setTimeout(() => {
        card.classList.remove('flash-ok', 'flash-ko');
        if (!queue.length) queue = shuffle(pool);
        cur = queue.pop();
        showCur();
        locked = false;
      }, 280);
    }
    function end() {
      stageCleanup();
      stageCleanup = null;
      const isRecord = score > state.best.sprint;
      if (isRecord) { state.best.sprint = score; save(); burst(); }
      body.innerHTML = `<p class="eyebrow">Temps écoulé</p><div class="score-big">${score}</div>
        <p>${done} réponse(s), ${score} juste(s). ${isRecord ? 'Nouveau record !' : 'Record : ' + state.best.sprint + '.'}</p>
        <div class="row"><button type="button" class="btn primary" id="sp-again">Rejouer</button><button type="button" class="btn" data-close>Fermer</button></div>
        ${misses.length ? `<h3 style="font-size:19px">Tes erreurs</h3><div class="recap-list">${misses.map((t) => `<div class="recap-item"><p><strong>${esc(t.s)}</strong></p><p>C'est <strong>${t.v ? 'vrai' : 'faux'}</strong>. ${esc(t.why)}</p></div>`).join('')}</div>` : ''}`;
      $('#sp-again', body).addEventListener('click', () => startSprint(mods));
    }
  }
}

// -------- Remets dans l'ordre --------
function startOrder(mods) {
  const items = pick(filterMods(ORDER, mods), 5);
  openStage('Remets dans l\'ordre');
  const body = stageBody();
  let i = 0;
  let score = 0;

  function render() {
    const it = items[i];
    setProgress(i / items.length);
    setMeta((i + 1) + ' / ' + items.length);
    let bank = it.parts.map((t, k) => ({ t, k }));
    do { bank = shuffle(bank); } while (bank.length > 1 && bank.every((p, idx) => p.t === it.parts[idx]));
    const answer = [];
    let checked = false;

    const draw = () => {
      body.innerHTML = `<p class="eyebrow">Ligne ${MOD[it.m].n} · Remets dans l'ordre</p><p class="q">${esc(it.p)}</p>
        <div><p class="zone-label">Ta réponse · touche un bloc pour le retirer</p><div class="zone answer"><ol>${answer.map((p, idx) => `<li><button type="button" class="part" data-a="${idx}">${esc(p.t)}</button></li>`).join('')}</ol></div></div>
        <div><p class="zone-label">Blocs restants · touche-les dans l'ordre</p><div class="zone">${bank.map((p, idx) => `<button type="button" class="part" data-b="${idx}">${esc(p.t)}</button>`).join('') || '<span class="muted">Tous les blocs sont placés.</span>'}</div></div>
        <div class="row"><button type="button" class="btn primary" id="ord-check"${bank.length ? ' disabled' : ''}>Vérifier</button><button type="button" class="btn" id="ord-reset">Tout remettre</button></div>
        <div id="fb" aria-live="polite"></div>`;
      $$('[data-b]', body).forEach((b) => b.addEventListener('click', () => { answer.push(bank.splice(Number(b.dataset.b), 1)[0]); draw(); focusNext(); }));
      $$('[data-a]', body).forEach((b) => b.addEventListener('click', () => { bank.push(answer.splice(Number(b.dataset.a), 1)[0]); draw(); focusNext(); }));
      $('#ord-reset', body).addEventListener('click', () => { bank = bank.concat(answer.splice(0)); draw(); });
      $('#ord-check', body).addEventListener('click', evaluate);
    };
    const focusNext = () => {
      const target = $('[data-b]', body) || $('#ord-check', body);
      if (target) target.focus({ preventScroll: true });
    };

    function evaluate() {
      if (checked) return;
      checked = true;
      const seq = answer.map((p) => p.t);
      let ok;
      let marks = null;
      if (it.deps) {
        const pos = (t) => seq.indexOf(t);
        ok = it.deps.every(([a, b]) => pos(a) < pos(b));
      } else {
        marks = seq.map((t, k) => t === it.parts[k]);
        ok = marks.every(Boolean);
      }
      record(it, ok);
      if (ok) score++;
      $$('[data-a]', body).forEach((b, idx) => {
        b.disabled = true;
        b.classList.add((marks ? marks[idx] : ok) ? 'is-right' : 'is-wrong');
      });
      $$('#ord-check, #ord-reset', body).forEach((b) => { b.disabled = true; });
      const fb = $('#fb', body);
      fb.innerHTML = `<div class="feedback ${ok ? 'ok' : 'ko'} pop"><strong>${ok ? 'Bon ordre !' : 'Pas le bon ordre.'}</strong>
        ${ok ? '' : `<p>Un ordre correct :</p><ol style="margin:0;padding-left:22px;font-family:var(--font-mono);font-size:14px">${it.parts.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>`}
        <p>${esc(it.why)}</p></div>
        <div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="ord-next">${i + 1 < items.length ? 'Puzzle suivant' : 'Voir mon score'}</button></div>`;
      const next = $('#ord-next', body);
      next.addEventListener('click', () => { i++; if (i >= items.length) finish(); else render(); });
      next.focus({ preventScroll: true });
      fb.scrollIntoView({ block: 'nearest', behavior: reducedMotion ? 'auto' : 'smooth' });
    }
    draw();
    $('#stage-scroll').scrollTop = 0;
  }

  function finish() {
    setProgress(1);
    setMeta('');
    if (score === items.length) burst();
    body.innerHTML = `<p class="eyebrow">Terminé</p><div class="score-big">${score}/${items.length}</div><p>${verdict(Math.round((100 * score) / items.length))}</p>
      <div class="row"><button type="button" class="btn primary" id="ord-again">Rejouer</button><button type="button" class="btn" data-close>Fermer</button></div>`;
    $('#ord-again', body).addEventListener('click', () => startOrder(mods));
  }

  render();
}

// ===================================================================
// Vue : PC
// ===================================================================
function renderPc(opts = {}) {
  const el = $('#view-pc');
  const exHTML = (ex) => {
    const sol = ex.html ? `<pre class="code"><code>${ex.sol}</code></pre>` : codeBlock(ex.sol);
    return `<div class="ex">
      <div class="ex-head"><input type="checkbox" id="${ex.id}" data-pc="${ex.id}"${state.pc[ex.id] ? ' checked' : ''}>
        <label for="${ex.id}"><span class="lvl" aria-label="Difficulté ${ex.lvl} sur 3">${'●'.repeat(ex.lvl)}${'○'.repeat(3 - ex.lvl)}</span><br>${esc(ex.q)}</label></div>
      <div class="row">${ex.hint ? `<button type="button" class="btn small" data-reveal="hint-${ex.id}" aria-expanded="false">Indice</button>` : ''}<button type="button" class="btn small" data-reveal="sol-${ex.id}" aria-expanded="false">Corrigé</button></div>
      ${ex.hint ? `<p class="hint" id="hint-${ex.id}" hidden>${esc(ex.hint)}</p>` : ''}
      <div id="sol-${ex.id}" hidden style="display:grid;gap:8px">${sol}
        <div class="row"><button type="button" class="btn small" data-copy="${ex.id}">Copier le corrigé</button></div>
        <p class="expect"><strong>Résultat attendu :</strong> ${esc(ex.expect)}</p></div>
    </div>`;
  };
  el.innerHTML = `
    <div class="view-head"><p class="eyebrow">Le soir, sur ton PC</p><h1 id="h-pc">Pratique MySQL</h1>
      <p class="muted">Tape tes requêtes toi-même dans le CLI <code>mysql&gt;</code>. Indice et corrigé restent cachés : ne les ouvre qu'après avoir vraiment essayé. Sans recherche, pas de mémorisation.</p></div>
    ${PRACTICE.map((sec) => {
      const done = sec.items.filter((x) => state.pc[x.id]).length;
      return `<details class="pc-sec" id="pc-${sec.id}"${opts.open === sec.id ? ' open' : ''}>
        <summary><div style="flex:1;min-width:0"><h2>${esc(sec.title)}</h2><span class="when">${esc(sec.when)}${sec.db ? ' · base ' + sec.db : ''} · ${done}/${sec.items.length} faits</span></div></summary>
        <div class="pc-body">${sec.intro ? `<div>${sec.intro}</div>` : ''}${sec.items.map(exHTML).join('')}</div>
      </details>`;
    }).join('')}`;
  if (opts.open) {
    const target = $('#pc-' + opts.open);
    if (target) setTimeout(() => target.scrollIntoView({ block: 'start', behavior: 'auto' }), 0);
  }
}

function findExercise(id) {
  for (const sec of PRACTICE) for (const ex of sec.items) if (ex.id === id) return ex;
  return null;
}
function copyExercise(btn) {
  const ex = findExercise(btn.dataset.copy);
  if (!ex) return;
  const text = ex.html ? ex.sol.replace(/<[^>]+>/g, '') : ex.sol;
  const fallback = () => {
    const pre = btn.closest('[id^="sol-"]').querySelector('pre');
    const range = document.createRange();
    range.selectNodeContents(pre);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(range);
    btn.textContent = 'Texte sélectionné : Ctrl+C';
  };
  try {
    navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copié'; }, fallback);
  } catch (e) { fallback(); }
}

// ===================================================================
// Confettis (désactivés si l'utilisateur réduit les animations)
// ===================================================================
function burst() {
  if (reducedMotion) return;
  const colors = MODULES.map((m) => m.color);
  for (let k = 0; k < 22; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.left = window.innerWidth / 2 + 'px';
    s.style.top = window.innerHeight / 3 + 'px';
    s.style.background = colors[k % colors.length];
    s.style.setProperty('--dx', Math.random() * 340 - 170 + 'px');
    s.style.setProperty('--dy', Math.random() * 300 - 60 + 'px');
    s.style.setProperty('--rot', Math.random() * 720 - 360 + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

// ===================================================================
// Événements (délégation)
// ===================================================================
let noteTimer = null;

document.addEventListener('click', (e) => {
  const inner = e.target.closest('.flip-inner');
  if (inner) { flipCard(); return; }
  const t = e.target.closest('[data-go],[data-view],[data-play],[data-toggle-read],[data-reveal],[data-copy],[data-card],[data-chip],[data-close]');
  if (!t) return;
  const d = t.dataset;
  if ('close' in d) { closeStage(); return; }
  if (d.view) { show(d.view); return; }
  if (d.go) { if (!$('#stage').hidden) closeStage(); runGo(d.go); return; }
  if (d.play) { runGo(d.play + ':' + (state.filter || []).join(',')); return; }
  if (d.toggleRead) {
    const id = d.toggleRead;
    state.read[id] = !state.read[id];
    if (state.read[id] && !state.readAward[id]) { state.readAward[id] = 1; state.xp += 20; burst(); }
    markActive();
    save();
    renderCours({ module: id });
    return;
  }
  if (d.reveal) {
    const target = document.getElementById(d.reveal);
    if (target) { target.hidden = !target.hidden; t.setAttribute('aria-expanded', String(!target.hidden)); }
    return;
  }
  if (d.copy) { copyExercise(t); return; }
  if (d.card) { gradeCard(d.card); return; }
  if (d.chip) {
    if (d.chip === 'all') state.filter = [];
    else {
      const set = new Set(state.filter);
      if (set.has(d.chip)) set.delete(d.chip); else set.add(d.chip);
      state.filter = MODULES.map((m) => m.id).filter((id) => set.has(id));
    }
    save();
    renderJeux();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#stage').hidden) { closeStage(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && e.target.classList && e.target.classList.contains('flip-inner')) { e.preventDefault(); flipCard(); }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'exam-date') {
    if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) { state.exam = t.value; save(); renderPlan(); $('#exam-date').focus(); }
    return;
  }
  if (t.dataset.plan) {
    state.plan[t.dataset.plan] = t.checked;
    if (t.checked) markActive();
    save();
    const id = t.id;
    renderPlan();
    const again = document.getElementById(id);
    if (again) again.focus({ preventScroll: true });
    return;
  }
  if (t.dataset.pc) {
    state.pc[t.dataset.pc] = t.checked;
    if (t.checked) { state.xp += 15; markActive(); }
    save();
    return;
  }
  if (t.id === 'deck-filter' && t.value) { buildDeck(t.value); renderCartes({}); }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.note) {
    state.notes[t.dataset.note] = t.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(save, 400);
  }
});

$('#stage-close').addEventListener('click', closeStage);
$('#theme-btn').addEventListener('click', cycleTheme);

// ===================================================================
// Démarrage
// ===================================================================
applyTheme();
updateTop();
const initial = (location.hash || '').replace('#', '');
show(VIEWS.includes(initial) ? initial : 'plan');
})();
